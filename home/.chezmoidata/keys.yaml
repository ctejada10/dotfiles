# Public halves only. The laptop's private keys live in 1Password and never
# leave it; the mini makes its own signing key during setup.
#
# The login and signing keys were made in 1Password on 25 Oct 2026, replacing
# arnor, arnor_claude, arnor_signing and the old RSA keys. If a public half
# below is ever emptied, the laptop has no signing key configured (commits fail
# loudly rather than go out unsigned) and the mini's authorized_keys is not
# written.
ssh:
  login:
    item: "SSH login key"
    vault: "Private"
    public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHNkWXUBz2DtuTrYwmqEKAgTbbhB+jvrQ8z/SW4HqQWb"
  signing:
    item: "SSH signing key"
    vault: "Private"
    public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGBK/k7j9ORhQEKlvGhC4OVCWU8ctw8pc4sK4iNnR11x"
  # The mini signs with a key it made itself.
  miniSigningPath: ".ssh/mini_signing.pub"
  # Keys that signed commits in the past. They stay in allowed_signers so old
  # signatures still verify; validBefore stops them vouching for anything new.
  retiredSigning:
    - public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDBVuQhsH411/O/wIZ8ARUHtYaRB3mZbrwQUKSbmq7WR"
      validBefore: ""
  # Phones and tablets that log in to the servers and the mini, each with a key
  # its SSH app (Blink Shell) made in its Secure Enclave, so the private half
  # never leaves the device. Empty until the key is pasted in; the playbook won't
  # turn a server's password login off while one is empty (README, "Adding a
  # phone or tablet").
  devices:
    iphone: "ssh-rsa  ctejada@gondolin"
    ipad: "ssh-rsa  ctejada@lothlorien"
  # Login keys that every server's next run takes out of authorized_keys.
  retiredLogin: []

email: "carlos@carlosetejada.com"

# The personal age key, in 1Password only. It is read with op when re-sealing
# on the mini and is never written to disk on any machine. Once each repo's
# first re-seal is done, every Hurin and Rivendell blob is sealed to its public
# half and to that server's own key; until then tilde's old key opens them
# (README, "Re-sealing secrets").
age:
  item: "dotfiles age key"
  vault: "Private"
  field: "password"
  public: "age1fkegjycfqp4ktjn5zrzv2mjj04rxexnmsh7rmwvg09hs0cumy5cs0a75pn"
