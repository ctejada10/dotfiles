# Repos each Mac clones from GitHub into a real ~/src, once, when they're
# missing. Work moves between the Macs through GitHub, not Dropbox, and
# nothing here pulls them.
#
# laptop: personal work and job hunting. ai-job-search updates through Git
#   and keeps its profile in local commits, and cv's applications live in
#   git-ignored folders of its checkout; personal.yaml lists both for the
#   weekly backup. career-ops isn't here: it's a Claude Code plugin. Of the
#   mini's repos only scripts is cloned here, because Raycast and Hazel run
#   it; it's pulled by hand and still developed on the mini. Read the others
#   on GitHub. The laptop clones over SSH through 1Password's agent.
# agent-mini: the development repos. All development happens on the mini,
#   where agents work in them on their own branches and worktrees. The mini
#   clones them over HTTPS through gh.
#
# A repo no role lists stays where it is in Dropbox's repositories folder, the
# repos' old home. The lists are revisited in *Do a fresh-start pass on every
# repo: structure and CI/CD*.
repos:
  laptop:
    ai-job-search: ai-job-search-dev/ai-job-search
    cv: ctejada10/cv
    scripts: ctejada10/scripts
  agent-mini:
    hurin: ctejada10/hurin
    rivendell: ctejada10/rivendell
    scripts: ctejada10/scripts
    cad-a11y: cad-accessibility/cad-a11y
    readme: ctejada10/ctejada10
    arwen: ctejada10/arwen
    faramir: ctejada10/faramir
