# Read when ansible-playbook runs from this folder.
[defaults]
# Only localhost. The servers are added from home/.chezmoidata/hosts.yaml by
# site.yml's first play, so there is no list of servers to keep in step.
inventory = inventory.yml
collections_path = ./collections
roles_path = ./roles
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false

[ssh_connection]
# Lets tasks become an unprivileged user (deploy, ctejada) without the acl
# package, and makes runs faster.
pipelining = true
