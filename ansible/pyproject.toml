# The playbook's tools, run from the laptop with `uv run` inside ansible/.
# Nothing here is installed globally.
[project]
name = "dotfiles-servers"
version = "0"
requires-python = ">=3.12"
dependencies = ["ansible-core==2.21.5"]

# The linter, which tests/ansible.sh runs and CI fails on. uv run installs it.
[dependency-groups]
dev = ["ansible-lint==26.10.1"]

[tool.uv]
package = false
