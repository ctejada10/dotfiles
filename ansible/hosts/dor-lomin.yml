# dor-lomin: the VPS that runs Morwen. Its address, SSH port and user are in
# home/.chezmoidata/hosts.yaml.

# Open to the internet besides SSH. The scan after each run fails when what
# answers differs from this.
public_ports:
  - { port: 80, proto: tcp, comment: caddy http }
  - { port: 443, proto: tcp, comment: caddy https }
# Open to the home network only. dor-lomin isn't on it.
lan_ports: []
# Rules to delete from UFW, matched as they were added.
ufw_remove: []

docker: true
# Publish to 127.0.0.1 unless a compose file names an address. Morwen's
# compose file publishes Caddy's 80 and 443 as 0.0.0.0:80 and 0.0.0.0:443.
docker_loopback_default: true
tailscale: false
samba: false

# Unattended upgrades reboot for a new kernel at this time, server time.
reboot_time: "04:00"
# Morwen's containers have restart: always, so they come back after a reboot.
automatic_reboot: true
# Password login goes off here.
password_login: false
# The checkout the deploy gate deploys, and the branch a commit must be on.
deploy_repo: /home/deploy/morwen
deploy_branch: main
# The repo deploy fetches, which the run clones there once GitHub takes the
# read key it prints. Morwen's containers write only in named volumes, so no
# folder in the checkout needs another owner.
deploy_github_repo: ctejada10/morwen
deploy_submodule_repos: []
deploy_owned_dirs: []
# The public half of the key GitHub Actions deploys with, which can only ask
# the gate for a deploy. Empty until that key is made, in 1Password as
# "morwen deploy key" (docs/setup-servers.md, "Moving a repo's deploy to the
# gate").
deploy_public_key: ""
# Public halves of keys to take out of deploy's authorized_keys. A fresh
# install has no other key there.
deploy_retired_keys: []
